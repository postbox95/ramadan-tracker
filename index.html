<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramadan Planner · 1447H · login + dynamic day</title>
  <!-- html2canvas for PNG download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      /* === THEME COLORS === */
      --primary: #1e655e;
      --primary-dark: #144451;
      --primary-light: #ACC11F;

      --secondary: #e8b550;
      --secondary-dark: #bd7a31;
      --secondary-light: #ffeed9;

      --bg-gradient-start: #d9f0ea;
      --bg-gradient-end: #c0e3db;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg,
          var(--bg-gradient-start) 0%,
          var(--bg-gradient-end) 100%);

      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    /* main planner card */
    .planner {
      max-width: 1150px;
      width: 100%;
      background: #ffffff;
      border-radius: 48px 48px 40px 40px;
      padding: 25px 35px 35px 35px;
      box-shadow: 0 30px 50px rgba(18, 52, 42, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.8);
      transition: all 0.2s;
    }

    /* ----- redesigned user panel (appealing & responsive) ----- */
    .user-panel {
      background: linear-gradient(115deg, #edfff9 0%, #d8f3ec 100%);
      border-radius: 30px;
      padding: 12px 25px 12px 20px;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #b3e0d6;
      box-shadow: 0 8px 18px -8px rgba(25, 90, 80, 0.3);
      gap: 15px;
    }

    .ramadan-badge {
      background: #1f655d;
      border-radius: 60px;
      padding: 8px 22px;
      color: white;
      font-weight: 600;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: inset 0 -3px 0 #0d3d37, 0 6px 12px rgba(0, 60, 50, 0.2);
      /* white-space: nowrap; */
    }

    .ramadan-badge span {
      font-size: 1.6rem;
      filter: drop-shadow(0 2px 2px #104e47);
    }

    .streak-box-modern {
      background: var(--secondary-light);
      border-radius: 60px;
      padding: 8px 25px;
      font-weight: 700;
      font-size: 1.4rem;
      color: var(--secondary-dark);
      display: flex;
      align-items: center;
      gap: 8px;
      border: 2px solid var(--secondary);
      box-shadow: 0 4px 0 var(--secondary-dark);
      white-space: nowrap;
    }

    .streak-box-modern span {
      font-size: 1.9rem;
    }

    .user-greeting-modern {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .login-area-modern {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      padding: 8px 18px;
      border-radius: 80px;
      backdrop-filter: blur(4px);
    }

    .login-area-modern input {
      border: 2px solid #b1d9d0;
      border-radius: 60px;
      padding: 12px 20px;
      font-size: 1rem;
      background: white;
      transition: 0.2s;
      flex: 1 1 180px;
      /* can grow & shrink */
      min-width: 0;
      /* IMPORTANT: prevents overflow in flex */
      width: 100%;
      /* fallback */
      max-width: 260px;
      /* optional limit */
    }

    .login-area-modern input:focus {
      border-color: #1e8f81;
      outline: none;
      box-shadow: 0 0 0 4px rgba(30, 143, 129, 0.2);
    }

    .auth-btn-modern {
      background: var(--primary);
      border: 2px solid var(--primary-dark);
      color: white;
      padding: 12px 30px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      border: 2px solid #17534d;
      white-space: nowrap;
      box-shadow: 0 6px 0 var(--primary-dark);
      flex-shrink: 0;
    }

    .auth-btn-modern.logout {
      background: #f1f1f1;
      color: #1d5c55;
      border: 2px solid #b1d9d0;
      box-shadow: 0 4px 0 #c0c0c0;
    }

    .auth-btn-modern:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 var(--primary-dark);
    }

    .auth-btn-modern.logout:hover {
      background: #ffe1e1;
      border-color: #d09b9b;
      color: #a03939;
      box-shadow: 0 6px 0 #b15858;
    }

    .planner-title {
      display: flex;
      justify-content: center;
      /* horizontal center */
      align-items: center;
      /* vertical alignment */
      margin: 0 0 20px 0;
      text-align: center;
    }

    .planner-title img {
      width: clamp(220px, 40vw, 420px);
    }


    /* responsive stacking */
    @media (max-width: 850px) {
      .user-panel {
        border-radius: 40px;
        padding: 16px;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }

      .user-greeting-modern {
        justify-content: center;
        text-align: center;
      }

      .login-area-modern {
        width: 100%;
        justify-content: center;
      }

      .login-area-modern input,
      .auth-btn-modern {
        width: 100%;
        max-width: 100%;
      }
    }


    @media (max-width: 750px) {
      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 2.2rem;
      }
    }

    .section {
      background: #f9fffe;
      border-radius: 28px;
      padding: 18px 22px 22px;
      margin-bottom: 22px;
      box-shadow: 0 10px 18px -8px rgba(27, 78, 74, 0.15);
      border: 1px solid #d2f0ea;
    }

    .section:last-child {
      margin-bottom: 20px;
    }

    h2 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #17534d;
      border-left: 7px solid var(--primary-light);
      padding-left: 18px;
      margin: 0 0 18px 0;
      line-height: 1.2;
    }

    /* Dua display styling */
    .dua-card {
      background: #f2fbf9;
      border-radius: 28px;
      padding: 18px 20px;
      border: 2px solid #c1e5dd;
      text-align: center;
    }

    .arabic {
      font-size: 2rem;
      font-family: 'Traditional Arabic', 'Amiri', serif;
      line-height: 2.2rem;
      color: #0d4c44;
      margin-bottom: 15px;
      font-weight: 500;
    }

    .transliteration {
      font-style: italic;
      color: #1f6d63;
      font-size: 1.2rem;
      margin-bottom: 10px;
      letter-spacing: 0.3px;
    }

    .translation {
      color: #1f4e48;
      font-size: 1.1rem;
      border-top: 1px dashed #b3ddd2;
      padding-top: 12px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .section-header h2 {
      margin-bottom: 0;
      border-left-color: #e8b550;
    }

    .add-btn {
      background: var(--primary);
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 60px;
      font-size: 0;
      /* remove extra space if any text remains */
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0, 60, 50, 0.2);
      transition: 0.15s;
      /* removed padding-bottom and line-height – not needed for SVG */
    }

    .add-btn:hover {
      background: var(--primary-dark);
      transform: scale(1.05);
    }

    textarea,
    input[type="text"] {
      width: 100%;
      border: 2px solid #c3e2dc;
      border-radius: 24px;
      padding: 12px 18px;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
      background: #ffffff;
      transition: 0.2s;
    }

    textarea:focus,
    input:focus {
      border-color: #1e8f81;
      outline: none;
      box-shadow: 0 0 0 4px rgba(30, 143, 129, 0.15);
    }

    .prayer-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 18px;
      margin-top: 5px;
    }

    .prayer {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #edf7f5;
      padding: 8px 12px 8px 8px;
      border-radius: 40px;
      border: 1px solid #c6e2db;
    }

    .prayer input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: #1e8f81;
      transform: scale(1.1);
      margin-left: 5px;
      cursor: pointer;
    }

    .prayer label {
      font-size: 1.15rem;
      font-weight: 500;
      color: #0f4d45;
      flex: 1;
      cursor: pointer;
    }

    #checklist-items {
      margin-top: 8px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .check-item input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: #e8b550;
      flex-shrink: 0;
      cursor: pointer;
    }

    .check-item input[type="text"] {
      flex: 1;
      border-radius: 40px;
    }

    .meal-sub {
      margin-bottom: 22px;
    }

    .meal-sub label {
      font-weight: 600;
      font-size: 1.3rem;
      color: #17534d;
      display: block;
      margin-bottom: 6px;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 35px;
    }

    .btn {
      border: none;
      background: white;
      padding: 16px 36px;
      border-radius: 60px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #1b4e4a;
      cursor: pointer;
      box-shadow: 0 12px 24px -12px rgba(0, 50, 40, 0.4);
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 2px solid #c2e2da;
    }

    .btn-download {
      background: var(--primary-dark);
      color: white;
      border: 2px solid var(--primary);
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 28px -14px #1b4e4a;
    }

    .footnote {
      margin-top: 25px;
      color: #26655e;
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>

      <!-- right side: login / logout area -->
      <div class="login-area-modern" id="loginAreaModern">

  <div class="footnote">— Ramadan 1447 starts Feb 19, 2026 —</div>

  <script>
    (function () {
      // ---------- RAMADAN START: Feb 19, 2026 (Ramadan 1, 1447) ----------
      const RAMADAN_START = new Date(2026, 1, 19); // month is 0-indexed: 1 = February

      // ---------- Duas list ----------
      const DUA_LIST = [
        { id: 1, arabic: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", transliteration: "Rabbana atina fid-dunya hasanatan wa fil-akhirati hasanatan waqina 'adhaban-nar", translation: "Our Lord, give us in this world good and in the Hereafter good and protect us from the punishment of the Fire." },
        { id: 2, arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى", transliteration: "Allahumma inni as'alukal-huda wat-tuqa wal-'afafa wal-ghina", translation: "O Allah, I ask You for guidance, piety, chastity and self-sufficiency." },
        { id: 3, arabic: "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", transliteration: "Allahumma a'innee 'ala dhikrika wa shukrika wa husni 'ibadatik", translation: "O Allah, help me to remember You, to thank You, and to worship You in the best manner." },
        { id: 4, arabic: "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي", transliteration: "Rabbi-shrah li sadri wa yassir li amri", translation: "My Lord, expand for me my chest and ease for me my task." },
        { id: 5, arabic: "اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي", transliteration: "Allahumma innaka 'afuwwun tuhibbul 'afwa fa'fu 'anni", translation: "O Allah, You are Forgiving and love forgiveness, so forgive me." },
        { id: 6, arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ سُبْحَانَ اللَّهِ الْعَظِيمِ", transliteration: "Subhanallahi wa bihamdihi subhanallahil-'azeem", translation: "Glory be to Allah and praise Him; Glory be to Allah, the Almighty." },
        { id: 7, arabic: "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ", transliteration: "Allahumma salli 'ala Muhammadin wa 'ala ali Muhammad", translation: "O Allah, send peace upon Muhammad and the family of Muhammad." },
        { id: 8, arabic: "لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", transliteration: "La ilaha illa anta subhanaka inni kuntu minaz-zalimeen", translation: "There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers." },
        { id: 9, arabic: "حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", transliteration: "Hasbiyallahu la ilaha illa huwa 'alayhi tawakkaltu wa huwa rabbul-'arshil-'azeem", translation: "Sufficient for me is Allah; there is no deity except Him. On Him I have relied, and He is the Lord of the Great Throne." },
        { id: 10, arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ", transliteration: "Allahumma inni as'alukal-jannata wa a'udhu bika minan-nar", translation: "O Allah, I ask You for Paradise and seek refuge in You from the Fire." }
      ];

      // ---------- localStorage keys ----------
      const STORAGE_USERS = 'ramadanUsers';
      const STORAGE_CURRENT = 'ramadanCurrentUser';

      const plannerEl = document.getElementById('planner');
      const greetingBox = document.getElementById('greetingBoxModern');
      const loginArea = document.getElementById('loginAreaModern');
      const duaDisplay = document.getElementById('duaDisplay');
      const addBtn = document.getElementById('addCheckItem');
      const checklistContainer = document.getElementById('checklist-items');
      const downloadBtn = document.getElementById('downloadBtn');
      const clearBtn = document.getElementById('clearBtn');

      // ---------- helpers ----------
      function getTodayString() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function loadUserData() {
        return JSON.parse(localStorage.getItem(STORAGE_USERS) || '{}');
      }

      function saveUserData(data) {
        localStorage.setItem(STORAGE_USERS, JSON.stringify(data));
      }

      function getCurrentUsername() {
        return localStorage.getItem(STORAGE_CURRENT);
      }

      function setCurrentUsername(name) {
        if (name) localStorage.setItem(STORAGE_CURRENT, name);
        else localStorage.removeItem(STORAGE_CURRENT);
      }

      // ---------- update streak ----------
      function updateStreak(username) {
        if (!username) return 0;
        const users = loadUserData();
        const today = getTodayString();
        const user = users[username] || { streak: 0, lastLogin: null, duaHistory: {}, currentDua: null };

        if (user.lastLogin === today) {
          return user.streak;
        }

        let newStreak = 1;
        if (user.lastLogin) {
          const prevDay = new Date(today);
          prevDay.setDate(prevDay.getDate() - 1);
          const prevDayStr = `${prevDay.getFullYear()}-${String(prevDay.getMonth() + 1).padStart(2, '0')}-${String(prevDay.getDate()).padStart(2, '0')}`;
          if (user.lastLogin === prevDayStr) {
            newStreak = (user.streak || 0) + 1;
          } else {
            newStreak = 1;
          }
        }
        users[username] = { ...user, streak: newStreak, lastLogin: today };
        saveUserData(users);
        return newStreak;
      }

      // ---------- get today's dua for user (no repeat 30d) ----------
      function getTodaysDua(username) {
        const users = loadUserData();
        const today = getTodayString();
        let user = users[username];
        if (!user) {
          user = { streak: 0, lastLogin: today, duaHistory: {}, currentDua: null };
          users[username] = user;
        }

        if (user.currentDua && user.currentDua.date === today) {
          return DUA_LIST.find(d => d.id === user.currentDua.id) || DUA_LIST[0];
        }

        const history = user.duaHistory || {};
        const thirtyDaysAgo = new Date(today);
        thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
        const cutoff = `${thirtyDaysAgo.getFullYear()}-${String(thirtyDaysAgo.getMonth() + 1).padStart(2, '0')}-${String(thirtyDaysAgo.getDate()).padStart(2, '0')}`;

        const eligible = DUA_LIST.filter(dua => {
          const last = history[dua.id];
          return !last || last < cutoff;
        });

        let selected;
        if (eligible.length > 0) {
          selected = eligible[Math.floor(Math.random() * eligible.length)];
        } else {
          let oldestDua = DUA_LIST[0];
          let oldestDate = history[oldestDua.id] || '0000-00-00';
          for (let dua of DUA_LIST) {
            const d = history[dua.id] || '0000-00-00';
            if (d < oldestDate) {
              oldestDate = d;
              oldestDua = dua;
            }
          }
          selected = oldestDua;
        }

        history[selected.id] = today;
        user.duaHistory = history;
        user.currentDua = { id: selected.id, date: today };
        users[username] = user;
        saveUserData(users);
        return selected;
      }

      // ---------- compute current Ramadan day (based on system date) ----------
      function getRamadanDay() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const start = new Date(RAMADAN_START);
        start.setHours(0, 0, 0, 0);

        const diffTime = today - start;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1; // day 1 on start date

        if (diffDays < 1) {
          return { day: null, status: 'upcoming', daysUntil: -diffDays + 1 };
        } else if (diffDays > 30) { // assume Ramadan is 30 days max
          return { day: null, status: 'after' };
        } else {
          return { day: diffDays, status: 'ramadan', year: 1447 };
        }
      }

      // ---------- render dua of the day ----------
      function renderDuaOfTheDay() {
        const username = getCurrentUsername();
        if (!username) {
          duaDisplay.innerHTML = `
            <div class="arabic">اللهم بارك لنا في رمضان</div>
            <div class="transliteration">Allahumma barik lana fi Ramadan</div>
            <div class="translation">O Allah, bless us in Ramadan</div>
          `;
          return;
        }
        const dua = getTodaysDua(username);
        duaDisplay.innerHTML = `
          <div class="arabic">${dua.arabic}</div>
          <div class="transliteration">${dua.transliteration}</div>
          <div class="translation">${dua.translation}</div>
        `;
      }

      // ---------- render auth panel (modern) ----------
      function renderAuthPanel() {
        const currentUser = getCurrentUsername();
        const users = loadUserData();
        let streak = 0;
        if (currentUser && users[currentUser]) {
          streak = users[currentUser].streak || 0;
        }

        // get ramadan day info
        const rDay = getRamadanDay();
        let ramadanDisplay = '';
        if (rDay.status === 'upcoming') {
          ramadanDisplay = `🌙 Ramadan starts in ${rDay.daysUntil} day${rDay.daysUntil > 1 ? 's' : ''}`;
        } else if (rDay.status === 'ramadan') {
          ramadanDisplay = `🌙 Ramadan ${rDay.day}, 1447`;
        } else {
          ramadanDisplay = `🌙 Ramadan 1447 (completed)`;
        }

        greetingBox.innerHTML = '';
        loginArea.innerHTML = '';

        if (currentUser) {
          // Logged in: show ramadan badge, streak, welcome message
          greetingBox.innerHTML = `
            <div class="ramadan-badge"> ${ramadanDisplay}</div>
<div class="streak-box-modern">
  <span>
    <svg width="1em" height="1em" viewBox="-33 0 255 255" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid">
      <defs>
        <style>
          .cls-3 { fill: url(#linear-gradient-1); }
          .cls-4 { fill: #fc9502; }
          .cls-5 { fill: #fce202; }
        </style>
        <linearGradient id="linear-gradient-1" gradientUnits="userSpaceOnUse" x1="94.141" y1="255" x2="94.141" y2="0.188">
          <stop offset="0" stop-color="#ff4c0d"/>
          <stop offset="1" stop-color="#fc9502"/>
        </linearGradient>
      </defs>
      <g id="fire">
        <path d="M187.899,164.809 C185.803,214.868 144.574,254.812 94.000,254.812 C42.085,254.812 -0.000,211.312 -0.000,160.812 C-0.000,154.062 -0.121,140.572 10.000,117.812 C16.057,104.191 19.856,95.634 22.000,87.812 C23.178,83.513 25.469,76.683 32.000,87.812 C35.851,94.374 36.000,103.812 36.000,103.812 C36.000,103.812 50.328,92.817 60.000,71.812 C74.179,41.019 62.866,22.612 59.000,9.812 C57.662,5.384 56.822,-2.574 66.000,0.812 C75.352,4.263 100.076,21.570 113.000,39.812 C131.445,65.847 138.000,90.812 138.000,90.812 C138.000,90.812 143.906,83.482 146.000,75.812 C148.365,67.151 148.400,58.573 155.999,67.813 C163.226,76.600 173.959,93.113 180.000,108.812 C190.969,137.321 187.899,164.809 187.899,164.809 Z" id="path-1" class="cls-3" fill-rule="evenodd"/>
        <path d="M94.000,254.812 C58.101,254.812 29.000,225.711 29.000,189.812 C29.000,168.151 37.729,155.000 55.896,137.166 C67.528,125.747 78.415,111.722 83.042,102.172 C83.953,100.292 86.026,90.495 94.019,101.966 C98.212,107.982 104.785,118.681 109.000,127.812 C116.266,143.555 118.000,158.812 118.000,158.812 C118.000,158.812 125.121,154.616 130.000,143.812 C131.573,140.330 134.753,127.148 143.643,140.328 C150.166,150.000 159.127,167.390 159.000,189.812 C159.000,225.711 129.898,254.812 94.000,254.812 Z" id="path-2" class="cls-4" fill-rule="evenodd"/>
        <path d="M95.000,183.812 C104.250,183.812 104.250,200.941 116.000,223.812 C123.824,239.041 112.121,254.812 95.000,254.812 C77.879,254.812 69.000,240.933 69.000,223.812 C69.000,206.692 85.750,183.812 95.000,183.812 Z" id="path-3" class="cls-5" fill-rule="evenodd"/>
      </g>
    </svg>
  </span>
  ${streak} day streak
</div>            <span style="font-weight:600; font-size:1.3rem; color:#17534d;">As-salamu alaykum, ${currentUser}</span>
          `;
          loginArea.innerHTML = `<button class="auth-btn-modern logout" id="logoutBtn">🚪 Logout</button>`;
          document.getElementById('logoutBtn')?.addEventListener('click', logout);
        } else {
          // Not logged in: show ramadan badge + input + login
          greetingBox.innerHTML = `
            <div class="ramadan-badge"><span>🕋</span> ${ramadanDisplay}</div>
            <span style="color:#17534d; font-weight:500;">Login to track streak & daily dua</span>
          `;
          loginArea.innerHTML = `
            <input type="text" id="usernameInput" placeholder="Enter username" value="">
            <button class="auth-btn-modern" id="loginBtn">🔐 Login</button>
          `;
          document.getElementById('loginBtn')?.addEventListener('click', loginHandler);
        }
      }

      // ---------- login/logout handlers ----------
      function loginHandler() {
        const input = document.getElementById('usernameInput');
        const username = input.value.trim();
        if (!username) {
          alert('Please enter a username');
          return;
        }
        updateStreak(username);
        setCurrentUsername(username);
        renderAuthPanel();
        renderDuaOfTheDay();
      }

      function logout() {
        setCurrentUsername(null);
        renderAuthPanel();
        renderDuaOfTheDay();
      }

      // ---------- init ----------
      function init() {
        const current = getCurrentUsername();
        if (current) {
          const users = loadUserData();
          const today = getTodayString();
          if (users[current] && users[current].lastLogin !== today) {
            updateStreak(current);
          } else if (!users[current]) {
            setCurrentUsername(null);
          }
        }
        renderAuthPanel();
        renderDuaOfTheDay();
      }

      // ---------- add checklist item ----------
      if (addBtn && checklistContainer) {
        addBtn.addEventListener('click', function () {
          const newDiv = document.createElement('div');
          newDiv.className = 'check-item';
          newDiv.innerHTML = '<input type="checkbox"> <input type="text" placeholder="New item">';
          checklistContainer.appendChild(newDiv);
        });
      }

      // ---------- download PNG ----------
      downloadBtn.addEventListener('click', function () {
        html2canvas(plannerEl, {
          scale: 1.8,
          backgroundColor: '#ffffff',
          allowTaint: false,
          useCORS: true,
          logging: false,
        }).then((canvas) => {
          const link = document.createElement('a');
          link.download = 'ramadan_planner.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(error => {
          alert('Could not download. Please try again.');
          console.error(error);
        });
      });

      // ---------- clear all fields ----------
      clearBtn.addEventListener('click', function () {
        const textInputs = plannerEl.querySelectorAll('input[type="text"]');
        const checkboxes = plannerEl.querySelectorAll('input[type="checkbox"]');
        const textareas = plannerEl.querySelectorAll('textarea');
        textInputs.forEach(input => input.value = '');
        textareas.forEach(textarea => textarea.value = '');
        checkboxes.forEach(checkbox => checkbox.checked = false);
      });

      init();
    })();
  </script>
